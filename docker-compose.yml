# ===== Obsidian Agent · Docker Compose（预构建镜像部署版）=====
# 仿 learning-platform 部署风格：镜像已推送到仓库，服务器上无需构建。
# 首次部署：docker compose up -d
# 更新：Dpanel 面板点「更新」（= restart，配合 pull_policy: always 会先拉新镜像）
#   或手动：docker compose pull && docker compose up -d
services:
  web:
    # 预构建并推送到 GHCR 的镜像（构建推送见 scripts/build-push.sh）。
    # 想换成 Docker Hub：把下面这行改成 image: simiely/obsidian-agent:latest
    # 并在 build-push.sh 里用 Docker Hub 账号 docker login 即可。
    image: ghcr.io/simiely/obsidian-agent:latest
    container_name: obsidian-agent
    # Dockerfile 默认用非 root 用户 appuser，但 SQLite 索引库在 host mount 下会因
    # 权限不匹配报 "attempt to write a readonly database"。
    # 家庭内网部署用 root 运行最简单可靠。
    user: root
    ports:
      - "4329:8080"               # 左侧为宿主机端口（2511 已被 learning-platform 占用），可改
    environment:
      # 容器内固定路径（与 volumes 对应，勿改）
      - VAULT_PATH=/vault
      - DATA_DIR=/data
      # 备份目录：必须落在挂载盘（/data 内）才持久化；默认 /app/backups 在容器可写层，重建即丢
      - BACKUP_DIR=/data/backups
      # LLM（可选；未填 API key 时仅禁用 Agent，浏览/编辑/检索/备份全部正常）
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      # 安全：非空时所有接口需请求头 X-Auth-Token（局域网多设备访问建议设置）
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      # Obsidian 库：只暴露 usb1 上的 AIWorkBuddy 这一个文件夹
      - /mnt/usb1/obsidian/AIWorkBuddy:/vault
      # 索引库 + 备份快照（持久化，勿删；仍在 usb2 原位置）
      - /mnt/usb2/Configs/obsidian-agent/data:/data
    restart: unless-stopped
    # Dpanel「更新」= restart，不加 pull_policy 不拉新镜像
    pull_policy: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
