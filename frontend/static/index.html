<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obsidian Agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <h1>Obsidian Agent</h1>
        <span id="app-version" class="badge">v?</span>
      </div>
      <div class="search-box">
        <input id="search-input" type="search" placeholder="搜索全部文档（中文分词）…" autocomplete="off" />
      </div>
      <nav id="tree" aria-label="文件树"></nav>
      <footer id="status-bar">
        <div class="status-line"><span class="dot" id="index-dot"></span><span id="index-status">索引：-</span></div>
        <div class="status-line"><span class="dot" id="backup-dot"></span><span id="backup-status">备份：-</span>
          <button id="backup-now" title="立即创建整库快照">备份</button>
        </div>
      </footer>
    </aside>

    <main id="main">
      <div id="doc-header" hidden>
        <span id="doc-path" title=""></span>
        <div class="actions">
          <button id="btn-edit" class="primary">编辑</button>
          <button id="btn-save" class="primary" hidden>保存</button>
          <button id="btn-cancel" hidden>取消</button>
        </div>
      </div>
      <div id="welcome" class="welcome">
        <p>从左侧选择一篇笔记，或直接搜索。</p>
      </div>
      <article id="doc-view" class="markdown-body" hidden></article>
      <textarea id="doc-editor" class="editor" hidden spellcheck="false"></textarea>
      <section id="search-results" hidden></section>
    </main>
  </div>

  <div id="toast" hidden></div>
  <script src="/md-render.js"></script>
  <script src="/app.js"></script>
</body>
</html>
